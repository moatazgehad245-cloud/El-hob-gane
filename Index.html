<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إلى مالك قلبي</title>
  <meta name="description" content="إلى مالك قلبي وقرة عيني">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #ffffff;
      --cream: #fff5f9;
      --blush: #ffd1e3;
      --rose: #ff6fa5;
      --hot: #ff2e7e;
      --magenta: #d81b60;
      --deep: #9c1248;
      --text: #5a0d2e;
      --shadow: 0 22px 50px -18px rgba(255, 46, 126, .45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Cairo", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--white);
      background-image: linear-gradient(180deg, var(--cream) 0%, var(--white) 55%, var(--blush) 100%);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== الجزء الأول ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 48px 16px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, #ffb3d1 0, transparent 42%),
        radial-gradient(circle at 88% 82%, #ff7fb0 0, transparent 45%),
        linear-gradient(160deg, #ffffff 0%, #ffe0ee 100%);
    }

    .hearts-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .float-heart {
      position: absolute;
      bottom: -60px;
      line-height: 1;
      opacity: .6;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes rise {
      to { transform: translateY(-115vh) rotate(25deg); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .crown {
      display: inline-block;
      font-size: 2.6rem;
      color: var(--hot);
      animation: beat 1.6s ease-in-out infinite;
    }

    .hero h1 {
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 8vw, 4.4rem);
      line-height: 1.6;
      color: var(--magenta);
      text-shadow: 0 4px 18px rgba(255, 46, 126, .25);
      margin-top: 8px;
    }

    .hero h1 span { color: var(--hot); }

    .scroll-hint {
      margin-top: 36px;
      font-size: 1rem;
      color: var(--deep);
      opacity: .85;
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }

    /* ===== الجواب (بيفتح وانتي بتنزلي) ===== */
    .letter {
      min-height: 80vh;
      display: grid;
      place-items: center;
      padding: 80px 16px 40px;
    }

    .quote-card {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding: 44px 28px 40px;
      background: var(--white);
      border: 2px solid var(--rose);
      border-radius: 28px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .quote-card::before {
      content: "💗";
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.8rem;
      line-height: 1;
      background: var(--white);
      padding: 0 10px;
    }

    .quote-card p {
      font-family: "Amiri", serif;
      font-size: clamp(1.35rem, 4.6vw, 1.85rem);
      line-height: 2.1;
      color: var(--deep);
    }

    .js .quote-card {
      opacity: 0;
      transform: translateY(40px) scale(.97);
      transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2, .7, .2, 1);
    }

    .js .quote-card.show {
      opacity: 1;
      transform: none;
    }

    /* ===== القلب ===== */
    .heart-section {
      display: flex;
      justify-content: center;
      padding: 20px 16px 120px;
    }

    .heart-link {
      position: relative;
      display: block;
      width: min(300px, 80vw);
      aspect-ratio: 1 / 1;
      color: var(--white);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .3s ease;
    }

    .heart-link:hover,
    .heart-link:focus-visible {
      transform: scale(1.06);
      outline: none;
    }

    .heart-svg {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 30px rgba(255, 46, 126, .45));
      animation: beat 1.6s ease-in-out infinite;
    }

    .heart-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 0 20% 16%;
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 4.8vw, 1.8rem);
      line-height: 1.5;
      text-align: center;
      text-shadow: 0 2px 10px rgba(156, 18, 72, .55);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .js .quote-card {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hearts-layer" id="hearts" aria-hidden="true"></div>
    <div class="hero-content">
      <div class="crown" aria-hidden="true">♥</div>
      <h1>إلى مالك قلبي<br><span>وقرة عيني</span></h1>
      <p class="scroll-hint" aria-hidden="true">↓ انزلي لتحت</p>
    </div>
  </section>

  <main>
    <section class="letter">
      <div class="quote-card" id="quote">
        <p>«أحبكِ كأنكِ العمرُ كلّه، وكأنّ ما قبلكِ لم يكن حياة، وما بعدكِ لا يُسمّى عمرًا.»</p>
      </div>
    </section>

    <section class="heart-section">
      <a class="heart-link"
         href="https://youtu.be/OgVJKSOmp5Q?si=PxIXKhJ4H2Pkjo73"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="بحبك حتي اسمعي">
        <svg class="heart-svg" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff7fb0"/>
              <stop offset="1" stop-color="#d81b60"/>
            </linearGradient>
          </defs>
          <path fill="url(#heartGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="heart-text">بحبك حتي اسمعي</span>
      </a>
    </section>
  </main>

  <script>
    (function () {
      // قلوب صغيرة طالعة في الخلفية
      var layer = document.getElementById('hearts');
      var colors = ['#ff2e7e', '#ff6fa5', '#ffb3d1', '#d81b60', '#ffffff'];
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (layer && !reduce) {
        for (var i = 0; i < 20; i++) {
          var h = document.createElement('span');
          h.className = 'float-heart';
          h.textContent = '♥';
          h.style.left = (Math.random() * 100) + '%';
          h.style.fontSize = (14 + Math.random() * 28) + 'px';
          h.style.color = colors[i % colors.length];
          h.style.animationDuration = (7 + Math.random() * 9) + 's';
          h.style.animationDelay = (-Math.random() * 14) + 's';
          layer.appendChild(h);
        }
      }

      // الجواب بيفتح لوحده وانتي بتنزلي في الصفحة
      var card = document.getElementById('quote');
      if (!card) return;

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries, obs) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('show');
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.3 });
        io.observe(card);
      } else {
        card.classList.add('show');
      }
    })();
  </script>
</body>
</html>
